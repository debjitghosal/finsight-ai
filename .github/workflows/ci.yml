name: FinSight Multi-Stage CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # --- Frontend Stages ---
  frontend-validate:
    name: "🔍 Validate Frontend Structure"
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Check Essential Files
      run: |
        test -f frontend/package.json
        test -f frontend/index.html
        test -d frontend/src

  frontend-audit:
    name: "🛡️ Security Audit (Frontend)"
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Run Audit
      working-directory: ./frontend
      run: npm audit --audit-level=high || true

  frontend-build:
    name: "🚀 Production Build (Vite)"
    needs: [frontend-validate]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: './frontend/package-lock.json'
    - name: Install Dependencies
      working-directory: ./frontend
      run: npm ci
    - name: Execute Build
      working-directory: ./frontend
      run: npm run build
      env:
        VITE_API_URL: https://finsight-ai-ijpw.onrender.com
        VITE_GOOGLE_CLIENT_ID: placeholder-for-ci-build

  # --- Backend Stages ---
  backend-verify:
    name: "🐍 Backend Syntax Verification"
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: Verify Python Compilation
      working-directory: ./backend
      run: python -m compileall .

  backend-dependencies:
    name: "📦 Backend Dependency Check"
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: Verify Requirements File
      working-directory: ./backend
      run: |
        test -f requirements.txt
        grep -q "fastapi" requirements.txt

  # --- Summary Stage ---
  system-integrity:
    name: "💎 Final Integrity Check"
    needs: [frontend-build, backend-verify, backend-dependencies, frontend-audit]
    runs-on: ubuntu-latest
    steps:
    - name: Report Success
      run: |
        echo "✅ All system checks passed successfully!"
        echo "FinSight AI is ready for deployment."
